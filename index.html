<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f6b63">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>ناسخ النصوص</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@600&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* التصميم: عمود واحد للهاتف، حقل رابط في الأعلى، نتيجة قابلة للتعديل، شريط أزرار سفلي ثابت */
:root{
  --bg:#f3f6f5;
  --surface:#ffffff;
  --fg:#12201e;
  --muted:#5d6f6c;
  --line:#d5dfdd;
  --accent:#0f6b63;
  --accent-fg:#ffffff;
  --danger:#b3261e;
  --font-display:"Reem Kufi","Tajawal",system-ui,sans-serif;
  --font-body:"Tajawal",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1716;--surface:#16231f;--fg:#e6efed;--muted:#93a8a4;--line:#2a3b37;
    --accent:#4cc2b4;--accent-fg:#06201c;--danger:#ff8a80;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1716;--surface:#16231f;--fg:#e6efed;--muted:#93a8a4;--line:#2a3b37;
  --accent:#4cc2b4;--accent-fg:#06201c;--danger:#ff8a80;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font-body);font-size:16px;line-height:1.6;
  padding-block:max(16px,env(safe-area-inset-top,0px)) calc(96px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100vh;
}
main{max-width:720px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--font-display);font-size:1.7rem;margin:8px 0 0;font-weight:600;text-wrap:balance}
.lead{margin:0;color:var(--muted);font-size:.95rem}
.field{display:flex;flex-direction:column;gap:8px}
label{font-size:.85rem;font-weight:700;letter-spacing:.02em;color:var(--muted)}
.row{display:flex;gap:8px}
.row>*{min-width:0}
input[type="url"]{
  flex:1;font:inherit;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);
  border-radius:10px;padding:12px 14px;direction:ltr;text-align:left;min-height:48px;
}
input::placeholder{color:var(--muted);opacity:.8}
textarea{
  width:100%;font:inherit;line-height:1.8;color:var(--fg);background:var(--surface);
  border:1.5px solid var(--line);border-radius:10px;padding:14px;min-height:46vh;resize:vertical;
}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{
  font:inherit;font-weight:700;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  color:var(--fg);padding:0 16px;min-height:48px;cursor:pointer;
}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
button:disabled{opacity:.55;cursor:default}
.status{min-height:1.6em;font-size:.9rem;color:var(--muted)}
.status.err{color:var(--danger)}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{
  position:fixed;inset-inline:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));
}
.bar .row{max-width:720px;margin:0 auto}
.bar button{flex:1}
.bar button.primary{flex:2}
.toast{
  position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);
  background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:.9rem;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>
<body>
<main>
  <div>
    <h1>ناسخ النصوص</h1>
    <p class="lead">الصق رابط الصفحة، وسيجلب التطبيق نصها لتنسخه بضغطة واحدة.</p>
  </div>

  <form class="field" id="form">
    <label for="url">رابط الصفحة</label>
    <div class="row">
      <input id="url" type="url" inputmode="url" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="https://example.com/article" required>
      <button type="button" id="paste">لصق</button>
    </div>
    <button type="submit" class="primary" id="go">جلب النص</button>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </form>

  <div class="field">
    <label for="out">النص المستخرج</label>
    <textarea id="out" placeholder="سيظهر النص هنا. يمكنك تعديله قبل النسخ."></textarea>
    <div class="meta"><span id="words">0 كلمة</span><span id="chars">0 حرف</span></div>
  </div>
</main>

<div class="bar">
  <div class="row">
    <button type="button" id="clear">مسح</button>
    <button type="button" class="primary" id="copy">نسخ النص</button>
  </div>
</div>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var urlEl = $('url'), outEl = $('out'), statusEl = $('status'), goBtn = $('go');

  function setStatus(msg, isErr){
    statusEl.textContent = msg || '';
    statusEl.className = 'status' + (isErr ? ' err' : '');
  }
  function toast(msg){
    var t = $('toast'); t.textContent = msg; t.classList.add('show');
    clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1800);
  }
  function updateCounts(){
    var v = outEl.value.trim();
    $('words').textContent = (v ? v.split(/\s+/).length : 0) + ' كلمة';
    $('chars').textContent = outEl.value.length + ' حرف';
  }
  function tidy(t){
    return t.replace(/\r/g,'').replace(/[ \t ]+\n/g,'\n').replace(/[ \t ]{2,}/g,' ').replace(/\n{3,}/g,'\n\n').trim();
  }
  function normalizeUrl(v){
    v = v.trim();
    if(!v) return '';
    if(!/^https?:\/\//i.test(v)) v = 'https://' + v;
    try { return new URL(v).href; } catch(e){ return ''; }
  }

  // الطريقة 1: خدمة قراءة تعيد النص جاهزاً
  function viaReader(url){
    return fetch('https://r.jina.ai/' + url, { headers: { 'X-Return-Format': 'text' } }).then(function(r){
      if(!r.ok) throw new Error('reader ' + r.status);
      return r.text();
    }).then(function(t){
      var i = t.indexOf('Markdown Content:');
      if(i !== -1) t = t.slice(i + 'Markdown Content:'.length);
      t = tidy(t);
      if(t.length < 40) throw new Error('empty');
      return t;
    });
  }

  // الطريقة 2: جلب الصفحة عبر وسيط ثم استخراج النص منها
  function extractFromHtml(html){
    var doc = new DOMParser().parseFromString(html, 'text/html');
    doc.querySelectorAll('script,style,noscript,nav,footer,aside,header,form,iframe,svg,button').forEach(function(n){ n.remove(); });
    var root = doc.querySelector('article') || doc.querySelector('main') || doc.body;
    if(!root) return '';
    root.querySelectorAll('p,div,li,br,h1,h2,h3,h4,h5,h6,tr,blockquote,section').forEach(function(n){
      n.appendChild(doc.createTextNode('\n'));
    });
    return tidy(root.textContent || '');
  }
  function viaProxy(url){
    return fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url)).then(function(r){
      if(!r.ok) throw new Error('proxy ' + r.status);
      return r.text();
    }).then(function(html){
      var t = extractFromHtml(html);
      if(t.length < 40) throw new Error('empty');
      return t;
    });
  }

  function run(){
    var url = normalizeUrl(urlEl.value);
    if(!url){ setStatus('الرابط غير صالح. تأكد من كتابته كاملاً.', true); return; }
    urlEl.value = url;
    goBtn.disabled = true; setStatus('جارٍ جلب النص...');
    viaReader(url).catch(function(){
      setStatus('جارٍ المحاولة بطريقة أخرى...');
      return viaProxy(url);
    }).then(function(text){
      outEl.value = text; updateCounts();
      setStatus('تم الجلب. اضغط "نسخ النص".');
      outEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }).catch(function(){
      setStatus('تعذر جلب النص من هذا الرابط. قد يكون الموقع يحجب القراءة الآلية أو يتطلب تسجيل دخول.', true);
    }).then(function(){ goBtn.disabled = false; });
  }

  function copyText(text){
    if(navigator.clipboard && navigator.clipboard.writeText){
      return navigator.clipboard.writeText(text).catch(function(){ return legacyCopy(text); });
    }
    return legacyCopy(text);
  }
  function legacyCopy(text){
    return new Promise(function(resolve, reject){
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy') ? resolve() : reject(); } catch(e){ reject(e); }
      ta.remove();
    });
  }

  $('form').addEventListener('submit', function(e){ e.preventDefault(); run(); });
  $('paste').addEventListener('click', function(){
    if(!navigator.clipboard || !navigator.clipboard.readText){ toast('اللصق التلقائي غير متاح، الصق يدوياً'); urlEl.focus(); return; }
    navigator.clipboard.readText().then(function(t){ urlEl.value = t.trim(); if(urlEl.value) run(); })
      .catch(function(){ toast('اللصق غير مسموح، الصق يدوياً'); urlEl.focus(); });
  });
  $('copy').addEventListener('click', function(){
    if(!outEl.value){ toast('لا يوجد نص لنسخه'); return; }
    copyText(outEl.value).then(function(){ toast('تم نسخ النص'); })
      .catch(function(){ outEl.focus(); outEl.select(); toast('حدد النص وانسخه يدوياً'); });
  });
  $('clear').addEventListener('click', function(){
    outEl.value = ''; urlEl.value = ''; updateCounts(); setStatus(''); urlEl.focus();
  });
  outEl.addEventListener('input', updateCounts);

  // يدعم فتح الصفحة بالشكل ?url=... مثل المشاركة من المتصفح
  try {
    var q = new URLSearchParams(location.search).get('url') || new URLSearchParams(location.search).get('text');
    if(q){ var m = q.match(/https?:\/\/\S+/); if(m){ urlEl.value = m[0]; run(); } }
  } catch(e){}
  updateCounts();
})();
</script>
</body>
</html>
